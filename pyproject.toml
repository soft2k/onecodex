[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onecodex"
version = "0.1.0"
description = "Local MCP bridge for 1C Designer XML and BSL sources"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2"]

[project.scripts]
onecodex = "onecodex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
